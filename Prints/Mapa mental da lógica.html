function apply(){stage.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`}
function fit(){let mx=0,my=0;M.forEach(n=>{const e=el(n.id);mx=Math.max(mx,n.x+(e?e.offsetWidth:W));my=Math.max(my,n.y+(e?e.offsetHeight:60))});
  const r=vp.getBoundingClientRect();view.z=Math.max(.25,Math.min(1,(r.width-40)/mx,(r.height-40)/my));view.x=(r.width-mx*view.z)/2;view.y=Math.max(20,(r.height-my*view.z)/2);apply()}
function zoom(f,cx,cy){const r=vp.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;const z=Math.max(.2,Math.min(2.2,view.z*f));view.x=cx-(cx-view.x)*(z/view.z);view.y=cy-(cy-view.y)*(z/view.z);view.z=z;apply()}

function renderBar(){
  const n=sel&&byId(sel);
  if(!n){bar.innerHTML='<span class="hint">Selecione um item para adicionar filhos, mudar o tipo, colocar rótulo (Sim / Não) ou excluir. Atalhos: Tab adiciona filho, Enter adiciona irmão, F2 edita, Delete exclui.</span>';return}
  bar.innerHTML=`<button class="btn solid" data-a="child">+ Filho</button>
  <button class="btn" data-a="sib" ${n.parent?'':'disabled'}>+ Irmão</button>
  <button class="btn" data-a="edit">Editar texto</button>
  <label for="selType">Tipo<select id="selType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===n.type?'selected':''}>${v}</option>`).join('')}</select></label>
  <label for="selTag">Rótulo<input id="selTag" type="text" value="${esc(n.tag)}" placeholder="Sim / Não"></label>
  <button class="btn danger" data-a="del" ${n.parent?'':'disabled'}>Excluir</button>
  <span class="hint">${sub(n.id).length>1?`Excluir remove também ${sub(n.id).length-1} item(ns) abaixo.`:''}</span>`;
}
function select(id){sel=id;stage.querySelectorAll('.node').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));renderBar()}
function add(parentId,afterId){
  push();const p=byId(parentId);const n={id:nid(),parent:parentId,text:'Novo item',type:'info',tag:'',x:p.x+COLW,y:p.y};
  const sibs=kids(parentId);if(sibs.length){const last=afterId?byId(afterId):sibs[sibs.length-1];const e=el(last.id);n.y=last.y+(e?e.offsetHeight:60)+GAP}
  if(afterId){const i=M.indexOf(byId(afterId));M.splice(i+1,0,n)}else M.push(n);
  save();render();select(n.id);startEdit(n.id);
}
function del(id){push();const ids=new Set(sub(id));const n=byId(id);M=M.filter(x=>!ids.has(x.id));sel=n.parent;save();render();toast('Item excluído. Use Desfazer se precisar.')}
function startEdit(id){
  const e=el(id);if(!e)return;editing=id;e.classList.add('editing');const tx=e.querySelector('.tx');tx.contentEditable='true';tx.focus();
  const r=document.createRange();r.selectNodeContents(tx);const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function endEdit(){
  if(!editing)return;const e=el(editing),n=byId(editing);editing=null;if(!e||!n)return;
  const tx=e.querySelector('.tx');const v=tx.innerText.replace(/\n{3,}/g,'\n\n').trim();tx.contentEditable='false';e.classList.remove('editing');
  if(v&&v!==n.text){push();n.text=v;save()}tx.textContent=n.text;links();
}

/* ponteiro: arrastar item (com filhos) ou fundo */
let drag=null;
vp.addEventListener('pointerdown',ev=>{
  if(ev.button!==0)return;
  const ne=ev.target.closest('.node');
  if(ne&&ne.classList.contains('editing'))return;
  if(editing)endEdit();
  if(ne){const id=ne.dataset.id;select(id);const ids=sub(id);drag={mode:'node',id,ids,sx:ev.clientX,sy:ev.clientY,start:ids.map(i=>{const n=byId(i);return [n.x,n.y]}),moved:false}}
  else{select(null);drag={mode:'pan',sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y};vp.classList.add('panning')}
  vp.setPointerCapture(ev.pointerId);
});
vp.addEventListener('pointermove',ev=>{
  if(!drag)return;const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;
  if(drag.mode==='pan'){view.x=drag.vx+dx;view.y=drag.vy+dy;apply();return}
  if(!drag.moved&&Math.hypot(dx,dy)<4)return;
  if(!drag.moved){push();drag.moved=true}
  drag.ids.forEach((i,k)=>{const n=byId(i);n.x=Math.round(drag.start[k][0]+dx/view.z);n.y=Math.round(drag.start[k][1]+dy/view.z);const e=el(i);if(e){e.style.left=n.x+'px';e.style.top=n.y+'px'}});links();
});
const endDrag=()=>{if(drag&&drag.mode==='node'&&drag.moved)save();drag=null;vp.classList.remove('panning')};
vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);
vp.addEventListener('dblclick',ev=>{const ne=ev.target.closest('.node');if(ne){select(ne.dataset.id);startEdit(ne.dataset.id)}});
vp.addEventListener('wheel',ev=>{ev.preventDefault();const r=vp.getBoundingClientRect();
  if(ev.ctrlKey||ev.metaKey)zoom(ev.deltaY<0?1.1:1/1.1,ev.clientX-r.left,ev.clientY-r.top);else{view.x-=ev.deltaX;view.y-=ev.deltaY;apply()}},{passive:false});
stage.addEventListener('keydown',ev=>{
  if(!editing||!ev.target.classList.contains('tx'))return;
  if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();endEdit();el(sel)?.focus()}
  if(ev.key==='Escape'){const n=byId(editing);ev.target.textContent=n.text;endEdit()}
});
stage.addEventListener('focusout',ev=>{if(editing&&ev.target.classList&&ev.target.classList.contains('tx'))endEdit()});
document.addEventListener('keydown',ev=>{
  if(editing||ev.target.closest('input,select,textarea'))return;
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();undo();return}
  if(!sel)return;const n=byId(sel);
  if(ev.key==='Tab'){ev.preventDefault();add(sel)}
  else if(ev.key==='Enter'&&n.parent){ev.preventDefault();add(n.parent,sel)}
  else if(ev.key==='F2'){ev.preventDefault();startEdit(sel)}
  else if((ev.key==='Delete'||ev.key==='Backspace')&&n.parent){ev.preventDefault();del(sel)}
});

let armT=null;
bar.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b||!sel)return;const a=b.dataset.a,n=byId(sel);
  if(a==='child')add(sel);
  if(a==='sib'&&n.parent)add(n.parent,sel);
  if(a==='edit')startEdit(sel);
  if(a==='del'){if(sub(sel).length>1&&!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar exclusão';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='Excluir'},3000);return}del(sel)}
});
bar.addEventListener('change',ev=>{
  if(!sel)return;const n=byId(sel);
  if(ev.target.id==='selType'){push();n.type=ev.target.value;save();render();select(sel)}
  if(ev.target.id==='selTag'){push();n.tag=ev.target.value.trim();save();render();select(sel)}
});

function undo(){if(!hist.length)return;M=JSON.parse(hist.pop());if(sel&&!byId(sel))sel=null;save();render();document.getElementById('undo').disabled=!hist.length;toast('Desfeito')}
document.getElementById('undo').onclick=undo;
document.getElementById('layout').onclick=()=>{push();layout();save();fit();toast('Mapa reorganizado')};
document.getElementById('zin').onclick=()=>zoom(1.15);
document.getElementById('zout').onclick=()=>zoom(1/1.15);
document.getElementById('fit').onclick=fit;
let resetArm=false,resetT=null;
document.getElementById('reset').onclick=e=>{const b=e.currentTarget;
  if(!resetArm){resetArm=true;b.classList.add('armed');b.textContent='Confirmar: apagar edições';clearTimeout(resetT);resetT=setTimeout(()=>{resetArm=false;b.classList.remove('armed');b.textContent='Restaurar modelo'},3000);return}
  resetArm=false;b.classList.remove('armed');b.textContent='Restaurar modelo';push();M=flatten(SPEC);sel=null;render();layout();save();fit();toast('Modelo restaurado')};

const dlg=document.getElementById('dlg');
function openDlg(html){dlg.innerHTML=`<div class="card">${html}</div>`;dlg.hidden=false}
dlg.addEventListener('click',ev=>{if(ev.target===dlg||ev.target.dataset.close!==undefined)dlg.hidden=true});
document.getElementById('exp').onclick=()=>{
  const json=JSON.stringify({nodes:M},null,1);
  openDlg(`<h2>Exportar mapa</h2><p>Copie o texto e guarde num arquivo ou mensagem. Depois, use Importar para recuperar ou levar o mapa para outro computador.</p><textarea id="expTxt" readonly>${esc(json)}</textarea><div class="row"><button class="btn" data-close>Fechar</button><button class="btn solid" id="cpy">Copiar</button></div>`);
  document.getElementById('cpy').onclick=()=>{const t=document.getElementById('expTxt');const fb=()=>{t.focus();t.select();toast('Texto selecionado. Use Ctrl+C')};
    try{navigator.clipboard.writeText(json).then(()=>toast('Copiado'),fb)}catch(e){fb()}};
};
document.getElementById('imp').onclick=()=>{
  openDlg(`<h2>Importar mapa</h2><p>Cole aqui o texto exportado. O mapa atual será substituído, e Desfazer volta para ele.</p><textarea id="impTxt" placeholder='{"nodes":[...]}'></textarea><div class="row"><button class="btn" data-close>Cancelar</button><button class="btn solid" id="doImp">Importar</button></div>`);
  document.getElementById('doImp').onclick=()=>{try{const d=JSON.parse(document.getElementById('impTxt').value);
      if(!Array.isArray(d.nodes)||!d.nodes.every(n=>n.id&&typeof n.text==='string'))throw 0;
      push();M=d.nodes.map(n=>({id:n.id,parent:n.parent||null,text:n.text,type:TYPES[n.type]?n.type:'info',tag:n.tag||'',x:+n.x||0,y:+n.y||0}));sel=null;save();render();dlg.hidden=true;fit();toast('Mapa importado')}
    catch(e){toast('Texto inválido. Cole o conteúdo exportado por completo')}};
};

/* Salvar em HTML: gera um arquivo independente com o mapa atual */
function buildHtml(){
  const data=JSON.stringify({nodes:M,savedAt:Date.now()}).replace(/</g,'\\u003c');
  const font='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">';
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+esc(document.title||'Mapa da Atribuição por Contratante')+'</title>'+font+'<style>'+CSS+'</style></head><body>'+SKEL+'<script>window.__GT3_MAP__='+data+';<\/script><script>'+SRC+'<\/script></body></html>';
}
function fileName(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `mapa-atribuicao-contratante-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.html`}
function showCopy(html,name){
  openDlg(`<h2>Salvar em HTML</h2><p>O salvamento direto não está disponível nesta tela. Copie o código, cole num arquivo de texto e salve com o nome <b>${esc(name)}</b>. Ao abrir o arquivo, o mapa aparece como está agora.</p><textarea id="htmlTxt" readonly>${esc(html)}</textarea><div class="row"><button class="btn" data-close>Fechar</button><button class="btn solid" id="cpyH">Copiar código</button></div>`);
  document.getElementById('cpyH').onclick=()=>{const t=document.getElementById('htmlTxt');const fb=()=>{t.focus();t.select();toast('Texto selecionado. Use Ctrl+C')};
    try{navigator.clipboard.writeText(html).then(()=>toast('Código copiado'),fb)}catch(e){fb()}};
}
let saving=false;
async function saveHtml(){
  if(saving)return;saving=true;if(editing)endEdit();
  const html=buildHtml(),name=fileName();
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
      if(!dl){showCopy(html,name);return}
      try{await dl.save({filename:name,data:html});toast('Arquivo HTML salvo')}
      catch(e){const c=e&&e.code;if(c==='declined')toast('Salvamento cancelado');else if(c==='rate_limited')toast('Aguarde um instante e tente de novo');else showCopy(html,name)}
      return;
    }
    const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Arquivo HTML salvo');
  }catch(e){showCopy(html,name)}
  finally{saving=false}
}
document.getElementById('saveHtml').onclick=saveHtml;
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();saveHtml()}});

document.getElementById('undo').disabled=true;
render();
const boot=()=>{if(needLayout){layout();save()}else links();fit()};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(boot));
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(fit,150)});
})();
</script></body></html>
